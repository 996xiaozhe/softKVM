[package]
name = "softkvm"
version = "0.1.0-beta.3"
description = "Use DDC/CI to switch monitor inputs"
authors = ["SoftKVM contributors"]
license = "MIT"
repository = "https://github.com/996xiaozhe/softKVM"
homepage = "https://github.com/996xiaozhe/softKVM"
edition = "2021"

[lib]
name = "softkvm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi"
] }
